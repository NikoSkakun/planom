buildscript {
    ext.kotlin_version = '2.1.0'
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.buildDir = '../build'
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// The discontinued flutter_app_badger 1.5.0 (and similarly old plugins) break the
// AGP 8 build two ways: they pin an ancient compileSdk (29) that can't resolve
// AndroidX resources like android:attr/lStar (API 31+), and they omit the
// `namespace` AGP 8 now requires, declaring only the legacy `package` attribute
// in their AndroidManifest.xml ("Namespace not specified" otherwise).
//
// Fix both in afterEvaluate: compileSdk must be set here (not eagerly) so it wins
// over the value the plugin's own build script assigns, while still landing before
// AGP creates the variant builder — this root hook is registered before AGP's own
// afterEvaluate, so it runs first. The namespace is back-filled from the legacy
// manifest `package` for any module that doesn't declare one. (The old template's
// `evaluationDependsOn(':app')` block was removed: it forced ':app' to evaluate
// first and pull plugin variants before this hook could run, resurfacing the
// "Namespace not specified" error. The modern plugin-loader settings.gradle
// doesn't need it.)
subprojects {
    afterEvaluate { project ->
        def android = project.extensions.findByName("android")
        if (android == null) {
            return
        }
        android.compileSdkVersion 36
        if (android.namespace == null) {
            def manifestFile = project.file("src/main/AndroidManifest.xml")
            if (manifestFile.exists()) {
                def pkg = new XmlParser().parse(manifestFile).attribute("package")
                if (pkg != null) {
                    android.namespace = pkg
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
