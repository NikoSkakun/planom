# TEMPORARY helper: reveals MATCH_PASSWORD so it can be copied to another repo.
#
# The GitHub Actions log masker redacts the raw secret, so this prints it as
# hex (which is not masked). Decode locally with:
#
#   echo 'PASTE_HEX_HERE' | xxd -r -p; echo
#
# DELETE THIS FILE once you've recovered the value, and optionally delete the
# run's logs (Actions → this run → ⋯ → Delete logs).
name: Reveal MATCH_PASSWORD (temp)

on:
  workflow_dispatch:

jobs:
  reveal:
    runs-on: ubuntu-latest
    steps:
      - name: Print MATCH_PASSWORD as hex
        run: |
          echo -n "${{ secrets.MATCH_PASSWORD }}" | xxd -p | tr -d '\n'; echo
