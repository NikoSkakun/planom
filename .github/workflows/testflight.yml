name: TestFlight

on:
  push:
    branches: [main]
  workflow_dispatch:          # allows manual trigger from the Actions tab

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: true   # cancel an in-flight build if a new commit lands

jobs:
  deploy:
    name: Build & Upload to TestFlight
    runs-on: macos-15
    timeout-minutes: 60

    env:
      FLUTTER_VERSION: "3.44.8"   # see the toolchain note in CLAUDE.md

    steps:
      # ── Source ───────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Flutter ──────────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install pub dependencies
        run: flutter pub get

      # ── Xcode ────────────────────────────────────────────────────────────────
      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app

      # ── iOS prebuild ──────────────────────────────────────────────────────────
      - name: Build Flutter iOS (unsigned)
        # --split-debug-info strips Dart symbol/debug info out of the binary
        # (smaller App.framework) and writes it to a side directory instead.
        # This is behaviour-neutral — no codegen change, no runtime/loading impact.
        run: flutter build ios --release --no-codesign --split-debug-info=build/debug-symbols

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios --repo-update

      # ── Ruby / Fastlane ───────────────────────────────────────────────────────
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true   # runs `bundle install` and caches gems automatically

      # ── Fastlane ─────────────────────────────────────────────────────────────
      - name: Run Fastlane beta lane
        env:
          APP_STORE_CONNECT_API_KEY_ID:        ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_KEY_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_CONTENT:   ${{ secrets.APP_STORE_CONNECT_API_KEY_CONTENT }}
          MATCH_REPOSITORY:                    ${{ secrets.MATCH_REPOSITORY }}
          MATCH_PASSWORD:                      ${{ secrets.MATCH_PASSWORD }}
          MATCH_GITHUB_USER:                   ${{ secrets.MATCH_GITHUB_USER }}
          MATCH_GITHUB_TOKEN:                  ${{ secrets.MATCH_GITHUB_TOKEN }}

        run: bundle exec fastlane beta

      # ── Debug symbols ─────────────────────────────────────────────────────────
      # split-debug-info moves Dart symbols out of the IPA, so retain them as an
      # artifact to symbolicate release stack traces later via `flutter symbolize`.
      - name: Upload Dart debug symbols
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dart-debug-symbols
          path: build/debug-symbols
          if-no-files-found: warn
