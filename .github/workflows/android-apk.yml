name: Android APK

# Paused: manual trigger only.
#
# Android is pinned to Flutter 3.24.5 (see FLUTTER_VERSION below) while iOS and
# macOS build on 3.32.0, and the two SDKs have drifted far enough apart that a
# dependency can satisfy one and not the other — flutter_math_fork, which the
# notes' LaTeX rendering needs, compiles on 3.24.5 only up to 0.7.3 and on
# 3.32.0 only from 0.7.4. The app follows the iOS toolchain, so this workflow
# would fail on every push for reasons that have nothing to do with the commit.
# Re-enable the `push` trigger once Android moves to the same Flutter version
# (which needs the NDK-reconciliation issue below sorted out first).
on:
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # Pinned to the SDK the app is developed against (android/local.properties).
      # iOS uses 3.32.0 for Xcode 26; on Android 3.32's Gradle plugin regressed
      # NDK-version reconciliation and crashes on plugins (file_picker) that
      # declare no ndkVersion. 3.24.5 has the null guard and builds cleanly.
      FLUTTER_VERSION: "3.24.5"

    steps:
      # ── Source ───────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Java ─────────────────────────────────────────────────────────────────
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ── Flutter ──────────────────────────────────────────────────────────────
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-

      - name: Install pub dependencies
        run: flutter pub get

      # ── Build ─────────────────────────────────────────────────────────────────
      # No keystore secrets are used here: with android/key.properties absent the
      # release build falls back to debug signing (see android/app/build.gradle),
      # so this produces an installable APK with no secret setup. For a
      # release-signed APK delivered to testers, use the Android Distribution
      # workflow instead.
      # --build-number stamps versionCode with minutes-since-epoch: monotonic and
      # ~29.6M today, well under Flutter's 2,100,000,000 versionCode cap.
      # --android-skip-build-dependency-validation: belt-and-suspenders against the
      # AGP/Kotlin version checks (project pins AGP 7.3.0 / Kotlin 1.7.10).
      - name: Build release APK
        run: >
          flutter build apk --release
          --build-number=$(($(date +%s) / 60))
          --split-debug-info=build/debug-symbols
          --android-skip-build-dependency-validation

      # ── Artifact ──────────────────────────────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
