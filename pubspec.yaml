name: planom
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  uuid: ^4.4.0
  flutter_app_badger: ^1.5.0
  image_picker: ^1.0.8
  path_provider: ^2.1.4
  share_plus: ^7.2.1
  file_picker: ^8.1.0
  intl: any
  flutter_markdown: ^0.7.4
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  crypto: ^3.0.3
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  local_auth: ^2.3.0
  cryptography: ^2.7.0
  icloud_storage: ^2.2.0
  flutter_secure_storage: ^9.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/tab_bar/
