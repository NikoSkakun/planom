name: planom
description: "A new Flutter project."

# Prevent accidental publishing to pub.dev.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.4 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.2
  sqflite: ^2.3.2
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  uuid: ^4.4.0
  flutter_app_badger: ^1.5.0
  image_picker: ^1.0.8
  path_provider: ^2.1.4
  share_plus: ^7.2.1
  file_picker: ^8.1.0
  intl: any
  flutter_markdown: ^0.7.4
  # Used directly for custom inline syntaxes (emoji presentation). Already
  # pulled in transitively by flutter_markdown; pinned here so the direct
  # import is explicit and version-stable.
  markdown: ^7.3.0
  url_launcher: ^6.3.0
  google_fonts: ^6.2.1
  crypto: ^3.0.3
  flutter_local_notifications: ^18.0.0
  timezone: ^0.9.4
  local_auth: ^2.3.0
  cryptography: ^2.7.0
  icloud_storage: ^2.2.0
  flutter_secure_storage: ^9.2.2
  # Google Calendar integration. flutter_appauth runs the OAuth2 + PKCE flow so
  # we can connect multiple accounts (one refresh token each, kept in
  # flutter_secure_storage); googleapis gives us the Calendar API client.
  flutter_appauth: ^9.0.1
  googleapis: ^13.2.0
  http: ^1.2.0
  pdf: ^3.11.3
  # 0.7.4 is the first release that builds against Flutter 3.32 (it swapped
  # `rebuildIfNecessary()` for `runLayoutCallback()`); 0.7.3 fails to compile
  # there. The iOS/macOS toolchain is the one this app targets — see the note
  # on the paused Android workflow in .github/workflows/android-apk.yml.
  flutter_math_fork: ^0.7.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  # Test-only: lets HomeShell widget tests stub path_provider (transitive deps
  # of path_provider, referenced directly only from tests).
  path_provider_platform_interface: ^2.1.0
  plugin_platform_interface: ^2.1.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/icons/tab_bar/
